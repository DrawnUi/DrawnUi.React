    <meta property="og:type" content="website" />

      property="og:description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <meta name="twitter:card" content="summary" />

      name="twitter:description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <!-- page background = canvas background, so nothing white shows while CanvasKit + fonts load -->
    <style>
      html, body { margin: 0; height: 100%; background: #212529; }
      /* .app is the viewport: the canvas takes the rest, the footer its own height. The crawlable block that
         drawnUiStatic generates at the marker after .app sits below the fold until the app's first frame removes it. */
      .app { height: 100%; display: flex; flex-direction: column; }
      #root { flex: 1; min-height: 0; }
      /* the crawlable block drawnUiStatic generates after #root (below the fold, removed at the app's first frame)
         inherits these; the footer keeps its own font */
      body { color: #adb5bd; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .drawnui-static h1, .drawnui-static h2, .drawnui-static li b { color: #fff; }
      .site-footer {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        padding: 8px 16px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #1a1d20;
        border-top: 1px solid #343a40;
      }
      .site-footer a { color: #9ec5fe; text-decoration: none; }
      .site-footer a:hover, .site-footer a:focus-visible { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="app">
    <div id="root"></div>
    <footer class="site-footer">
      <a href="https://github.com/DrawnUi/DrawnUi.React">DrawnUI for React on GitHub</a>
      <a href="https://www.npmjs.com/package/drawnui-react">drawnui-react on npm</a>
      <a href="https://drawnui.net">DrawnUI for .NET, the engine this port follows</a>
      <a href="/skills/drawnui-react/SKILL.md">DrawnUI for React skill for AI agents</a>
    </footer>
    </div>
    <!-- drawnui-static -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
