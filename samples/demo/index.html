<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawnUI for React — Skia canvas UI on CanvasKit</title>
    <meta
      name="description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <link rel="canonical" href="https://helloreact.drawnui.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrawnUI for React" />
    <meta property="og:url" content="https://helloreact.drawnui.net/" />
    <meta property="og:title" content="DrawnUI for React — Skia canvas UI on CanvasKit" />
    <meta
      property="og:description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DrawnUI for React — Skia canvas UI on CanvasKit" />
    <meta
      name="twitter:description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <!-- page background = canvas background, so nothing white shows while CanvasKit + fonts load -->
    <style>
      html, body { margin: 0; height: 100%; background: #212529; }
      /* the canvas takes the rest of the viewport, the footer its own height: no page scrollbar */
      body { display: flex; flex-direction: column; }
      #root { flex: 1; min-height: 0; overflow: auto; }
      /* generated by drawnUiStatic (vite.config.ts) into #root at build time from the accessibility tree; on screen
         only until the app's first frame (React replaces #root's children), kept if the app never boots */
      .drawnui-static { max-width: 820px; margin: 0 auto; padding: 32px 24px 48px; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #adb5bd; }
      .drawnui-static h1 { color: #fff; font-size: 28px; margin: 0 0 4px; }
      .drawnui-static h2 { color: #fff; font-size: 20px; margin: 28px 0 8px; }
      .drawnui-static h3 { color: #dee2e6; font-size: 16px; margin: 16px 0 4px; }
      .drawnui-static p { margin: 0 0 8px; }
      .drawnui-static ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .drawnui-static li { padding: 10px 14px; border-radius: 8px; background: #2b3035; }
      .drawnui-static li a { color: inherit; text-decoration: none; display: block; }
      .drawnui-static li b { color: #fff; margin-right: 6px; }
      .drawnui-static li a:hover, .drawnui-static li a:focus-visible { color: #fff; }
      .site-footer {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        padding: 8px 16px;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #1a1d20;
        border-top: 1px solid #343a40;
      }
      .site-footer a { color: #9ec5fe; text-decoration: none; }
      .site-footer a:hover, .site-footer a:focus-visible { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <footer class="site-footer">
      <a href="https://github.com/DrawnUi/DrawnUi.React">DrawnUI for React on GitHub</a>
      <a href="https://www.npmjs.com/package/drawnui-react">drawnui-react on npm</a>
      <a href="https://drawnui.net">DrawnUI for .NET, the engine this port follows</a>
      <a href="/skills/drawnui-react/SKILL.md">DrawnUI for React skill for AI agents</a>
    </footer>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
