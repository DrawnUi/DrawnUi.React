<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrawnUI for React — Skia canvas UI on CanvasKit</title>
    <meta
      name="description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <link rel="canonical" href="https://helloreact.drawnui.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrawnUI for React" />
    <meta property="og:url" content="https://helloreact.drawnui.net/" />
    <meta property="og:title" content="DrawnUI for React — Skia canvas UI on CanvasKit" />
    <meta
      property="og:description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DrawnUI for React — Skia canvas UI on CanvasKit" />
    <meta
      name="twitter:description"
      content="DrawnUI for React draws UI with Skia on CanvasKit, using the same engine and API as DrawnUI for .NET — npm package drawnui-react, MIT."
    />
    <!-- page background = canvas background, so nothing white shows while CanvasKit + fonts load -->
    <style>
      html, body { margin: 0; height: 100%; background: #212529; }
      /* the crawlable block below the app gives the page a scrollbar until the first frame removes it: keep the gutter
         so the canvas has the same width before and after boot */
      html { scrollbar-gutter: stable; }
      /* .app is the viewport, the canvas fills it. The crawlable block that drawnUiStatic generates at the marker
         after .app sits below the fold until the app's first frame removes it. */
      .app { height: 100%; display: flex; flex-direction: column; }
      #root { flex: 1; min-height: 0; }
      /* the crawlable block drawnUiStatic generates after .app (below the fold, removed at the app's first frame) inherits these */
      body { color: #adb5bd; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .drawnui-static h1, .drawnui-static h2, .drawnui-static li b { color: #fff; }
    </style>
  </head>
  <body>
    <div class="app">
    <div id="root"></div>
    </div>
    <!-- drawnui-static -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
