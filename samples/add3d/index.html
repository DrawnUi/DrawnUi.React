    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DrawnUI 3D",
        "url": "https://add3dreact.drawnui.net/",
        "description": "Real 3D models inside a drawn UI, in the browser: a product viewer, a shop list with live 3D thumbnails, cards, a globe with pins, a form with a 3D mascot and a field of 100 animated characters, in a 3D or hand-drawn look. Made with DrawnUI for React.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebGL 2",
        "inLanguage": "en",
        "author": { "@type": "Organization", "name": "DrawnUI", "url": "https://drawnui.net/" }
      }
    </script>

    <link rel="icon" href="favicon.ico" />
    <style>
      html, body { margin: 0; height: 100%; background: #121218; overflow: hidden; }
      /* 100dvh: the part of the screen the browser's own bars leave free (Safari on an iPhone). */
      #root { width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
      /* The loading screen of every DrawnUI web page (DrawnUI for Rust dev/web-loader.ps1), in the gallery's colors as
         on add3d.drawnui.net: src/loader.ts fills the progress from the bytes as they arrive and removes it with the
         first drawn frame. */
      :root {
        --drawnui-loader-background: radial-gradient(ellipse at 50% 55%, #241f45 0%, #0e1018 65%);
        --drawnui-loader-title: linear-gradient(#ffffff, #c9c0ff 55%, #7c6cf2);
        --drawnui-loader-track: #221f3a;
        --drawnui-loader-fill: linear-gradient(90deg, #7c6cf2, #c9c0ff);
        --drawnui-loader-glow: #7c6cf2;
        --drawnui-loader-glow-soft: rgba(124, 108, 242, 0.45);
        --drawnui-loader-glow-strong: rgba(124, 108, 242, 0.8);
        --drawnui-loader-text: #8b86a8;
      }
      .drawnui-loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
                        justify-content: center; gap: 22px; transition: opacity 0.35s;
                        background: var(--drawnui-loader-background, radial-gradient(ellipse at 50% 55%, #2a1406 0%, #000 65%)); }
      .drawnui-loader.done { opacity: 0; pointer-events: none; }
      .drawnui-loader-title { font: 800 44px var(--drawnui-loader-font, system-ui, sans-serif); letter-spacing: 2px; text-align: center;
                              padding: 0 16px; background: var(--drawnui-loader-title, linear-gradient(#fff4d0, #ffc050 55%, #d06810));
                              -webkit-background-clip: text; background-clip: text; color: transparent;
                              animation: drawnui-loader-glow 1.6s ease-in-out infinite; }
      .drawnui-loader-bar { width: min(260px, 60vw); height: 4px; border-radius: 2px; overflow: hidden;
                            background: var(--drawnui-loader-track, #2a1d10); }
      .drawnui-loader-fill { height: 100%; width: var(--drawnui-load-percentage, 0%); transition: width 0.2s;
                             background: var(--drawnui-loader-fill, linear-gradient(90deg, #d06810, #ffc050));
                             box-shadow: 0 0 10px var(--drawnui-loader-glow, #ff8a20); }
      .drawnui-loader-text { font: 12px var(--drawnui-loader-font, system-ui, sans-serif); letter-spacing: 3px;
                             color: var(--drawnui-loader-text, #8a7a66); }
      .drawnui-loader-text::after { content: " " var(--drawnui-load-percentage-text, ""); }
      @keyframes drawnui-loader-glow {
        0%, 100% { filter: drop-shadow(0 0 10px var(--drawnui-loader-glow-soft, rgba(255, 138, 32, 0.45))); }
        35% { filter: drop-shadow(0 0 22px var(--drawnui-loader-glow-strong, rgba(255, 138, 32, 0.8))); }
        60% { filter: drop-shadow(0 0 14px var(--drawnui-loader-glow-soft, rgba(255, 110, 20, 0.55))); }
      }
      @media (prefers-reduced-motion: reduce) { .drawnui-loader-title { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="drawnui-loader" id="loader" role="progressbar" aria-label="Loading DrawnUI 3D Demo" aria-valuemin="0" aria-valuemax="100">
      <div class="drawnui-loader-title">DRAWNUI 3D DEMO</div>
      <div class="drawnui-loader-bar"><div class="drawnui-loader-fill"></div></div>
      <div class="drawnui-loader-text">LOADING</div>
    </div>
    <noscript>
      <h1>DrawnUI 3D</h1>
      <p>
        Real 3D models inside a drawn UI: a product viewer, a shop list with live 3D thumbnails, cards, a globe with pins,
        a form with a 3D mascot and a field of 100 animated characters. Made with DrawnUI for React. The gallery needs
        JavaScript and WebGL 2 to run.
      </p>
      <p><a href="https://drawnui.net/">DrawnUI</a> · <a href="https://helloreact.drawnui.net/">DrawnUI for React demo</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
