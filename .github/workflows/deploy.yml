name: Deploy helloworld to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-helloworld
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build samples/demo (hosted at the domain root)
        run: npx vite build samples/demo
        env:
          BASE_PATH: /
      - name: Site extras (public skills + llms-full.txt)
        run: node dev/site-extras.mjs dist/demo
      - name: Deploy to Cloudflare Pages (helloreact.drawnui.net)
        run: npx --yes wrangler@4 pages deploy dist/demo --project-name helloreact-drawnui --branch master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
